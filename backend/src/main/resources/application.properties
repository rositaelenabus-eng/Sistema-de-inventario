# Puerto del servidor backend
server.port=8080

# Nombre de la aplicación
spring.application.name=backend-productos

# Configuración de base de datos H2 (en memoria, ideal para pruebas y desarrollo)
spring.datasource.url=jdbc:h2:mem:tiendadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola web de H2 para inspeccionar las tablas en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

